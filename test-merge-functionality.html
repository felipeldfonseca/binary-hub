<!DOCTYPE html>
<html>
<head>
    <title>Test CSV Data Merge</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .logs { background: #f5f5f5; padding: 10px; font-family: monospace; white-space: pre-wrap; }
        button { margin: 5px; padding: 10px 15px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Test CSV Data Merge Functionality</h1>
    
    <div class="section">
        <h2>Setup Test Data</h2>
        <button onclick="clearAllData()">Clear All Data</button>
        <button onclick="addDay18Data()">Add Day 18 Data (3 trades)</button>
        <button onclick="addDay27Data()">Add Day 27 Data (2 trades)</button>
        <button onclick="addMixedData()">Add Mixed Data (with duplicates)</button>
    </div>
    
    <div class="section">
        <h2>Current Data Status</h2>
        <button onclick="showCurrentData()">Refresh Status</button>
        <div id="status"></div>
    </div>
    
    <div class="section">
        <h2>Test Scenarios</h2>
        <button onclick="testScenario1()">Scenario 1: Day 18 → Day 27</button>
        <button onclick="testScenario2()">Scenario 2: Day 27 → Day 18</button>
        <button onclick="testScenario3()">Scenario 3: Add duplicates</button>
    </div>
    
    <div class="section">
        <h2>Logs</h2>
        <div id="logs" class="logs"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            logs.innerHTML += `[${timestamp}] <span class="${className}">${message}</span>\n`;
            logs.scrollTop = logs.scrollHeight;
            console.log(message);
        }

        // Sample trade data
        const day18Trades = [
            {
                id: "18-1",
                entryTime: "2024-08-18 09:30:00",
                asset: "EURUSD",
                direction: "call",
                amount: 50,
                entryPrice: 1.0950,
                exitPrice: 1.0970,
                result: "win",
                profit: 40,
                pnl: 40
            },
            {
                id: "18-2",
                entryTime: "2024-08-18 10:15:00",
                asset: "GBPUSD",
                direction: "put",
                amount: 30,
                entryPrice: 1.2680,
                exitPrice: 1.2650,
                result: "win",
                profit: 24,
                pnl: 24
            },
            {
                id: "18-3",
                entryTime: "2024-08-18 11:00:00",
                asset: "EURUSD",
                direction: "call",
                amount: 25,
                entryPrice: 1.0960,
                exitPrice: 1.0940,
                result: "loss",
                profit: -25,
                pnl: -25
            }
        ];

        const day27Trades = [
            {
                id: "27-1",
                entryTime: "2024-08-27 14:20:00",
                asset: "USDJPY",
                direction: "put",
                amount: 75,
                entryPrice: 149.50,
                exitPrice: 149.20,
                result: "win",
                profit: 60,
                pnl: 60
            },
            {
                id: "27-2",
                entryTime: "2024-08-27 15:45:00",
                asset: "AUDUSD",
                direction: "call",
                amount: 40,
                entryPrice: 0.6780,
                exitPrice: 0.6760,
                result: "loss",
                profit: -40,
                pnl: -40
            }
        ];

        // Utility function to simulate the merge logic
        function getTradeKey(trade) {
            return `${trade.entryTime}-${trade.asset}-${trade.direction}-${trade.amount}`;
        }

        function mergeTradesWithExisting(newTrades) {
            const existingTrades = localStorage.getItem('binaryHub_trades');
            let allTrades = newTrades;
            let existingCount = 0;
            let duplicatesSkipped = 0;

            if (existingTrades) {
                try {
                    const parsedExistingTrades = JSON.parse(existingTrades);
                    existingCount = parsedExistingTrades.length;

                    const existingKeys = new Set(parsedExistingTrades.map(getTradeKey));
                    const newUniqueTrades = newTrades.filter(trade => {
                        const isDuplicate = existingKeys.has(getTradeKey(trade));
                        if (isDuplicate) duplicatesSkipped++;
                        return !isDuplicate;
                    });

                    allTrades = [...parsedExistingTrades, ...newUniqueTrades];
                    log(`Merge: ${existingCount} existing + ${newUniqueTrades.length} new = ${allTrades.length} total (${duplicatesSkipped} duplicates)`, 'success');
                } catch (error) {
                    log(`Error parsing existing trades: ${error.message}`, 'error');
                    allTrades = newTrades;
                }
            } else {
                log(`No existing trades, storing ${newTrades.length} new trades`, 'info');
            }

            // Calculate stats
            const totalTrades = allTrades.length;
            const winTrades = allTrades.filter(t => t.result === 'win').length;
            const lossTrades = allTrades.filter(t => t.result === 'loss').length;
            const totalProfit = allTrades.reduce((sum, t) => sum + (t.pnl || t.profit || 0), 0);
            const avgStake = totalTrades > 0 ? allTrades.reduce((sum, t) => sum + (t.amount || 0), 0) / totalTrades : 0;

            const mergedStats = {
                totalTrades,
                winTrades,
                lossTrades,
                winRate: totalTrades > 0 ? (winTrades / totalTrades) * 100 : 0,
                totalProfit,
                avgStake
            };

            return { allTrades, mergedStats, existingCount, duplicatesSkipped };
        }

        function storeTradeData(trades, stats) {
            localStorage.setItem('binaryHub_hasData', 'true');
            localStorage.setItem('binaryHub_trades', JSON.stringify(trades));
            localStorage.setItem('binaryHub_stats', JSON.stringify(stats));
            log(`Stored ${trades.length} trades in localStorage`, 'success');
        }

        function clearAllData() {
            localStorage.removeItem('binaryHub_hasData');
            localStorage.removeItem('binaryHub_trades');
            localStorage.removeItem('binaryHub_stats');
            log('All data cleared from localStorage', 'info');
            showCurrentData();
        }

        function addDay18Data() {
            const { allTrades, mergedStats } = mergeTradesWithExisting(day18Trades);
            storeTradeData(allTrades, mergedStats);
            showCurrentData();
        }

        function addDay27Data() {
            const { allTrades, mergedStats } = mergeTradesWithExisting(day27Trades);
            storeTradeData(allTrades, mergedStats);
            showCurrentData();
        }

        function addMixedData() {
            // Mix of new and duplicate trades
            const mixedTrades = [
                ...day18Trades.slice(0, 1), // Duplicate from day 18
                {
                    id: "new-1",
                    entryTime: "2024-08-29 16:00:00",
                    asset: "EURGBP",
                    direction: "put",
                    amount: 100,
                    entryPrice: 0.8450,
                    exitPrice: 0.8430,
                    result: "win",
                    profit: 80,
                    pnl: 80
                }
            ];
            
            const { allTrades, mergedStats } = mergeTradesWithExisting(mixedTrades);
            storeTradeData(allTrades, mergedStats);
            showCurrentData();
        }

        function showCurrentData() {
            const hasData = localStorage.getItem('binaryHub_hasData');
            const trades = localStorage.getItem('binaryHub_trades');
            const stats = localStorage.getItem('binaryHub_stats');

            const status = document.getElementById('status');
            let html = '<h3>Current Status</h3>';
            
            html += `<p><strong>Has Data:</strong> ${hasData || 'false'}</p>`;
            
            if (trades) {
                try {
                    const tradesData = JSON.parse(trades);
                    html += `<p><strong>Total Trades:</strong> ${tradesData.length}</p>`;
                    
                    // Group by date
                    const dateGroups = tradesData.reduce((groups, trade) => {
                        const date = trade.entryTime.split(' ')[0];
                        if (!groups[date]) groups[date] = [];
                        groups[date].push(trade);
                        return groups;
                    }, {});
                    
                    html += '<p><strong>Trades by Date:</strong></p><ul>';
                    Object.keys(dateGroups).sort().forEach(date => {
                        html += `<li>${date}: ${dateGroups[date].length} trades</li>`;
                    });
                    html += '</ul>';
                    
                } catch (e) {
                    html += `<p class="error">Error parsing trades: ${e.message}</p>`;
                }
            } else {
                html += '<p>No trades data</p>';
            }
            
            if (stats) {
                try {
                    const statsData = JSON.parse(stats);
                    html += '<p><strong>Statistics:</strong></p>';
                    html += `<ul>`;
                    html += `<li>Total Trades: ${statsData.totalTrades}</li>`;
                    html += `<li>Win Rate: ${statsData.winRate?.toFixed(1)}%</li>`;
                    html += `<li>Total Profit: $${statsData.totalProfit?.toFixed(2)}</li>`;
                    html += `</ul>`;
                } catch (e) {
                    html += `<p class="error">Error parsing stats: ${e.message}</p>`;
                }
            }
            
            status.innerHTML = html;
        }

        function testScenario1() {
            log('=== SCENARIO 1: Day 18 → Day 27 ===', 'info');
            clearAllData();
            log('Step 1: Adding Day 18 data (3 trades)', 'info');
            addDay18Data();
            
            setTimeout(() => {
                log('Step 2: Adding Day 27 data (2 trades)', 'info');
                addDay27Data();
                
                // Verify both days are present
                const trades = JSON.parse(localStorage.getItem('binaryHub_trades') || '[]');
                const day18Count = trades.filter(t => t.entryTime.includes('2024-08-18')).length;
                const day27Count = trades.filter(t => t.entryTime.includes('2024-08-27')).length;
                
                if (day18Count === 3 && day27Count === 2) {
                    log('✅ SUCCESS: Both days preserved!', 'success');
                } else {
                    log(`❌ FAILED: Day 18: ${day18Count}/3, Day 27: ${day27Count}/2`, 'error');
                }
            }, 100);
        }

        function testScenario2() {
            log('=== SCENARIO 2: Day 27 → Day 18 ===', 'info');
            clearAllData();
            log('Step 1: Adding Day 27 data (2 trades)', 'info');
            addDay27Data();
            
            setTimeout(() => {
                log('Step 2: Adding Day 18 data (3 trades)', 'info');
                addDay18Data();
                
                // Verify both days are present
                const trades = JSON.parse(localStorage.getItem('binaryHub_trades') || '[]');
                const day18Count = trades.filter(t => t.entryTime.includes('2024-08-18')).length;
                const day27Count = trades.filter(t => t.entryTime.includes('2024-08-27')).length;
                
                if (day18Count === 3 && day27Count === 2) {
                    log('✅ SUCCESS: Both days preserved!', 'success');
                } else {
                    log(`❌ FAILED: Day 18: ${day18Count}/3, Day 27: ${day27Count}/2`, 'error');
                }
            }, 100);
        }

        function testScenario3() {
            log('=== SCENARIO 3: Adding duplicates ===', 'info');
            // Ensure we have some data first
            if (!localStorage.getItem('binaryHub_trades')) {
                addDay18Data();
                setTimeout(() => addMixedData(), 100);
            } else {
                addMixedData();
            }
        }

        // Initialize
        showCurrentData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>LocalStorage Test</title>
</head>
<body>
    <h1>LocalStorage Debug</h1>
    <div id="output"></div>

    <script>
        function debugLocalStorage() {
            const output = document.getElementById('output');
            let html = '<h2>LocalStorage Contents:</h2>';
            
            // Check for Binary Hub data
            const hasData = localStorage.getItem('binaryHub_hasData');
            const trades = localStorage.getItem('binaryHub_trades');
            const stats = localStorage.getItem('binaryHub_stats');
            
            html += `<p><strong>binaryHub_hasData:</strong> ${hasData}</p>`;
            html += `<p><strong>binaryHub_trades exists:</strong> ${!!trades}</p>`;
            html += `<p><strong>binaryHub_stats exists:</strong> ${!!stats}</p>`;
            
            if (trades) {
                try {
                    const tradesData = JSON.parse(trades);
                    html += `<p><strong>Trades count:</strong> ${tradesData.length}</p>`;
                    html += `<p><strong>First trade:</strong></p>`;
                    html += `<pre>${JSON.stringify(tradesData[0], null, 2)}</pre>`;
                } catch (e) {
                    html += `<p><strong>Error parsing trades:</strong> ${e.message}</p>`;
                }
            }
            
            if (stats) {
                try {
                    const statsData = JSON.parse(stats);
                    html += `<p><strong>Stats:</strong></p>`;
                    html += `<pre>${JSON.stringify(statsData, null, 2)}</pre>`;
                } catch (e) {
                    html += `<p><strong>Error parsing stats:</strong> ${e.message}</p>`;
                }
            }
            
            output.innerHTML = html;
        }
        
        // Add some test data if none exists
        function addTestData() {
            const testTrades = [
                {
                    id: "test-1",
                    entryTime: "2025-08-25 10:00:00",
                    asset: "EURUSD",
                    direction: "call",
                    amount: 50,
                    entryPrice: 1.0950,
                    exitPrice: 1.0970,
                    result: "win",
                    profit: 40,
                    pnl: 40
                },
                {
                    id: "test-2",
                    entryTime: "2025-08-25 10:30:00",
                    asset: "GBPUSD",
                    direction: "put",
                    amount: 30,
                    entryPrice: 1.2680,
                    exitPrice: 1.2650,
                    result: "win",
                    profit: 24,
                    pnl: 24
                },
                {
                    id: "test-3",
                    entryTime: "2025-08-25 11:00:00",
                    asset: "EURUSD",
                    direction: "call",
                    amount: 25,
                    entryPrice: 1.0960,
                    exitPrice: 1.0940,
                    result: "loss",
                    profit: -25,
                    pnl: -25
                }
            ];
            
            const testStats = {
                winTrades: 2,
                lossTrades: 1,
                totalProfit: 39,
                avgStake: 35
            };
            
            localStorage.setItem('binaryHub_hasData', 'true');
            localStorage.setItem('binaryHub_trades', JSON.stringify(testTrades));
            localStorage.setItem('binaryHub_stats', JSON.stringify(testStats));
            
            alert('Test data added!');
            debugLocalStorage();
        }
        
        function clearData() {
            localStorage.removeItem('binaryHub_hasData');
            localStorage.removeItem('binaryHub_trades');
            localStorage.removeItem('binaryHub_stats');
            alert('Data cleared!');
            debugLocalStorage();
        }
        
        // Run on page load
        debugLocalStorage();
    </script>
    
    <button onclick="addTestData()">Add Test Data</button>
    <button onclick="clearData()">Clear Data</button>
    <button onclick="debugLocalStorage()">Refresh</button>
</body>
</html>

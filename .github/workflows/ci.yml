name: CI

on:
  pull_request:
  push:
    branches:
      - feature/rebuild-lean

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx jest --ci

      - name: Type check
        run: npx tsc --noEmit

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as the Supabase project
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Database tests (migrations, backfill, RLS, import functions)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run.sh

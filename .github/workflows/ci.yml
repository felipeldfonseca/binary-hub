name: CI

on:
  pull_request:
  push:
    branches:
      - feature/rebuild-lean

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx jest --ci

      - name: Type check
        run: npx tsc --noEmit
